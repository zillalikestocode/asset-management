<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  .card { padding: 20px; background: var(--af-surface); border: 1px solid var(--af-border); border-radius: 8px; }
  .row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 52px; border-radius: 4px; border: 1px solid rgba(14,17,22,.06); }
  .name { display: flex; flex-direction: column; gap: 1px; }
  .name b { font-family: var(--af-font-sans); font-weight: 600; font-size: 11px; }
  .name span { font-family: var(--af-font-mono); font-size: 9px; color: var(--af-fg-muted); }
</style>
</head>
<body style="padding: 20px;">
  <div class="card">
    <div class="af-eyebrow" style="margin-bottom: 12px;">Neutral · Ink Scale</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:#FAFAF9"></div><div class="name"><b>050</b><span>FAFAF9</span></div></div>
      <div class="sw"><div class="chip" style="background:#F4F5F7"></div><div class="name"><b>100</b><span>F4F5F7</span></div></div>
      <div class="sw"><div class="chip" style="background:#E2E5EA"></div><div class="name"><b>200</b><span>E2E5EA</span></div></div>
      <div class="sw"><div class="chip" style="background:#C7CCD3"></div><div class="name"><b>300</b><span>C7CCD3</span></div></div>
      <div class="sw"><div class="chip" style="background:#9AA3AE"></div><div class="name"><b>400</b><span>9AA3AE</span></div></div>
      <div class="sw"><div class="chip" style="background:#6B7280"></div><div class="name"><b>500</b><span>6B7280</span></div></div>
      <div class="sw"><div class="chip" style="background:#4A5260"></div><div class="name"><b>600</b><span>4A5260</span></div></div>
      <div class="sw"><div class="chip" style="background:#2A2F38"></div><div class="name"><b>700</b><span>2A2F38</span></div></div>
      <div class="sw"><div class="chip" style="background:#0E1116"></div><div class="name"><b>900</b><span>0E1116</span></div></div>
    </div>
  </div>
</body>
</html>
