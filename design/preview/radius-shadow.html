<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Radius & Shadow</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  .card { padding: 24px; background: var(--af-surface); border: 1px solid var(--af-border); border-radius: 8px; }
  .section { margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sample { background: var(--af-surface); border: 1px solid var(--af-border); height: 56px; display: flex; align-items: center; justify-content: center; font-family: var(--af-font-mono); font-size: 10px; color: var(--af-fg-muted); }
  .sh-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .sh { height: 64px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--af-font-mono); font-size: 10px; color: var(--af-fg-muted); }
</style>
</head>
<body style="padding: 20px;">
  <div class="card">
    <div class="section">
      <div class="af-eyebrow" style="margin-bottom: 10px;">Corner Radius</div>
      <div class="grid">
        <div class="sample" style="border-radius:3px">sm · 3</div>
        <div class="sample" style="border-radius:5px">md · 5</div>
        <div class="sample" style="border-radius:6px">lg · 6</div>
        <div class="sample" style="border-radius:8px">xl · 8</div>
        <div class="sample" style="border-radius:999px">pill</div>
      </div>
    </div>
    <div class="section" style="margin-bottom:0">
      <div class="af-eyebrow" style="margin-bottom: 10px;">Elevation</div>
      <div class="sh-grid">
        <div class="sh" style="box-shadow: 0 0 0 1px var(--af-border);">shadow-0 · hairline</div>
        <div class="sh" style="box-shadow: 0 1px 0 rgba(14,17,22,.04), 0 1px 2px rgba(14,17,22,.06);">shadow-1 · card</div>
        <div class="sh" style="box-shadow: 0 8px 24px rgba(14,17,22,.08), 0 2px 4px rgba(14,17,22,.06);">shadow-3 · popover</div>
      </div>
    </div>
  </div>
</body>
</html>
